name: 功能建议
description: 提议新的功能或交互改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请描述期望的交互和使用场景。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他可选方案（可选）
